backend:
  name: git-gateway
  branch: main

media_folder: "assets/products/uploads"
public_folder: "assets/products/uploads"

publish_mode: simple

collections:
  - name: "store"
    label: "Scentivity Store"
    files:
      - name: "products"
        label: "Products"
        file: "data/products.json"
        format: "json"
        fields:


          - label: "Homepage Video"
            name: "homepageVideo"
            widget: "object"
            collapsed: false
            hint: "Controls the autoplay video banner on the homepage. Upload an MP4 video for best results. Videos autoplay muted on mobile."
            fields:
              - { label: "Enable Homepage Video", name: "enabled", widget: "boolean", default: true, required: false }
              - { label: "Video File", name: "videoFile", widget: "file", required: false, hint: "Upload an MP4 video. Recommended: short muted product video." }
              - { label: "Poster Image", name: "posterImage", widget: "image", required: false, hint: "Image shown while the video loads." }
              - { label: "Headline", name: "headline", widget: "string", required: false, default: "Sweet scents in motion." }
              - { label: "Subheading", name: "subheading", widget: "text", required: false, default: "Explore fragrance mists, body care, luxury picks, and gift-ready bundles." }
              - { label: "Button Text", name: "buttonText", widget: "string", required: false, default: "Shop Scentivity" }
              - { label: "Button Link", name: "buttonLink", widget: "string", required: false, default: "#products" }

          - label: "Deal of the Week"
            name: "dealOfWeek"
            widget: "object"
            collapsed: false
            hint: "Choose the single product to feature in the Deal of the Week section. Type the exact Product Name."
            fields:
              - { label: "Enable Deal of the Week", name: "enabled", widget: "boolean", default: true, required: false }
              - label: "Deal Type"
                name: "itemType"
                widget: "select"
                default: "product"
                options:
                  - { label: "Single Product", value: "product" }
                  - { label: "Combo Deal", value: "combo" }
              - { label: "Product Name to Feature", name: "productName", widget: "string", required: false, hint: "Use this only when Deal Type is Single Product. Must match the Product Name exactly." }
              - { label: "Combo Name to Feature", name: "comboName", widget: "string", required: false, hint: "Leave blank unless you intentionally change the deal type to Combo Deal." }
              - { label: "Badge Text", name: "badgeText", widget: "string", required: false, default: "Deal of the Week" }
              - { label: "Deal Heading", name: "title", widget: "string", required: false, hint: "Example: Bundle your favorites and save." }
              - { label: "Deal Description", name: "description", widget: "text", required: false, hint: "Short catchy text buyers will see under the Deal of the Week heading. Example: Fresh picks. Sweet savings." }
              - { label: "Button Text", name: "buttonText", widget: "string", required: false, default: "Add Deal to Cart" }
              - { label: "Optional Deal Image", name: "image", widget: "image", required: false, hint: "Optional. If empty, the selected product/combo image will be used." }



          - label: "Combo Deals Section"
            name: "comboDealsSettings"
            widget: "object"
            collapsed: false
            hint: "Turn the Combo Deals section on or off and edit the heading text."
            fields:
              - { label: "Show Combo Deals Section", name: "enabled", widget: "boolean", default: true, required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false, default: "Save more with curated scent bundles." }
              - { label: "Description", name: "description", widget: "text", required: false, default: "Pick a discounted combo, add it to cart, and checkout the same way as regular products." }

          - label: "Build Your Own Bundle"
            name: "bundleBuilder"
            widget: "object"
            collapsed: false
            hint: "Turn this on/off to let buyers build their own discounted bundle from available products."
            fields:
              - { label: "Enable Build Your Own Bundle", name: "enabled", widget: "boolean", default: false, required: false }
              - { label: "Discount for 2 Items (%)", name: "discountTwoItems", widget: "number", default: 5, value_type: "int", min: 0, max: 100, required: false }
              - { label: "Discount for 3 or More Items (%)", name: "discountThreeOrMore", widget: "number", default: 10, value_type: "int", min: 0, max: 100, required: false }
              - { label: "Admin Note", name: "note", widget: "text", required: false }


          - label: "Customer Reviews"
            name: "customerReviews"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}} stars — Approved: {{fields.approved}}"
            collapsed: true
            hint: "Only reviews marked Approved will show on the website. Customer-submitted reviews should be checked first, then added here or approved here."
            fields:
              - { label: "Customer Name", name: "name", widget: "string" }
              - { label: "Rating", name: "rating", widget: "number", default: 5, value_type: "int", min: 1, max: 5 }
              - { label: "Products Purchased", name: "productsPurchased", widget: "text", required: false, hint: "Products or combo the customer purchased." }
              - { label: "Review Message", name: "message", widget: "text" }
              - { label: "Approved for Website", name: "approved", widget: "boolean", default: false, required: false }
              - { label: "Review Date", name: "date", widget: "datetime", required: false }
              - { label: "Source", name: "source", widget: "hidden", default: "admin_added", required: false }


          - label: "Product Catalogue / Categories"
            name: "productCatalogue"
            widget: "list"
            summary: "{{fields.label}} — {{fields.categoryName}}"
            collapsed: true
            hint: "Add or edit catalogue names and their subcategories. Product Main Category must match the Category Name Used by Products."
            fields:
              - { label: "Catalogue Button Label", name: "label", widget: "string", hint: "Example: BBW, VICTORIA SECRET, DESIGNER FRAGRANCE, GIFT SETS" }
              - { label: "Category Name Used by Products", name: "categoryName", widget: "string", hint: "Example: Bath & Body Works Collection. Use gift_sets for the Gift Sets special filter." }
              - { label: "Show in Product Catalogue", name: "showInCatalogue", widget: "boolean", default: true, required: false }
              - label: "Subcategories"
                name: "subcategories"
                widget: "list"
                summary: "{{fields.name}}"
                field: { label: "Subcategory Name", name: "name", widget: "string" }

          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.mainCategory}} / {{fields.subCategory}} — {{fields.price}}"
            collapsed: false
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Brand", name: "brand", widget: "string", required: false, hint: "Example: Scentivity, Victoria's Secret, Bath & Body Works" }
              - { label: "Main Category", name: "mainCategory", widget: "string", hint: "Type the exact Category Name Used by Products from Product Catalogue / Categories. Example: Bath & Body Works Collection" }
              - { label: "Fragrance / Care Type", name: "subCategory", widget: "string", hint: "Type or add any subcategory. Example: Fine Fragrance Mist, Gift Sets, Body Care, Scented Candles" }
              - { label: "Price", name: "price", widget: "string", hint: "Example: GH₵250" }
              - { label: "Size", name: "size", widget: "string", required: false, hint: "Example: 50 mL, 236 mL, 8 oz, 3-wick candle, Gift set" }
              - { label: "Product Photo", name: "image", widget: "image", required: false }
              - { label: "Optional Direct Payment Link / Checkout URL", name: "paymentLink", widget: "string", required: false, hint: "Optional: paste a Paystack, Flutterwave, Stripe, or other hosted checkout link for this individual product. The cart checkout can also use Paystack through the Netlify Function setup." }
              - { label: "Scent Notes / Description", name: "notes", widget: "text", required: false }
              - { label: "Set as Deal of the Week", name: "isDealOfWeek", widget: "boolean", default: false, required: false, hint: "Optional shortcut. If more than one item is selected, the first matching item will be used." }
              - label: "Product Status"
                name: "productStatus"
                widget: "select"
                required: false
                default: "Available"
                hint: "Choose Available for products customers can buy now, Incoming for coming-soon products, or Out of Stock for products not currently available."
                options:
                  - { label: "Available", value: "Available" }
                  - { label: "Incoming", value: "Incoming" }
                  - { label: "Out of Stock", value: "Out of Stock" }
              - { label: "Available Quantity / Stock", name: "availableQuantity", widget: "number", required: false, value_type: "int", min: 0, hint: "Number of this product currently available." }
              - { label: "Star Rating", name: "rating", widget: "number", required: false, value_type: "float", min: 1, max: 5, step: 0.1, hint: "Example: 4.8" }
              - { label: "Number of Reviews", name: "reviewCount", widget: "number", required: false, value_type: "int", min: 0 }
              - { label: "5-star count", name: "rating5Count", widget: "number", required: false, value_type: "int", min: 0, default: 0 }
              - { label: "4-star count", name: "rating4Count", widget: "number", required: false, value_type: "int", min: 0, default: 0 }
              - { label: "3-star count", name: "rating3Count", widget: "number", required: false, value_type: "int", min: 0, default: 0 }
              - { label: "2-star count", name: "rating2Count", widget: "number", required: false, value_type: "int", min: 0, default: 0 }
              - { label: "1-star count", name: "rating1Count", widget: "number", required: false, value_type: "int", min: 0, default: 0 }
              - { label: "Number Purchased / Bought", name: "purchaseCount", widget: "number", required: false, value_type: "int", min: 0 }
              - { label: "Product Details / Overview", name: "productDetails", widget: "text", required: false }
              - { label: "Fragrance Notes", name: "fragranceNotes", widget: "text", required: false }
              - { label: "Ingredients", name: "ingredients", widget: "text", required: false }
              - { label: "Show Product on Website", name: "showOnWebsite", widget: "boolean", default: true, required: false, hint: "Turn this off to hide the product from the homepage, shop, and product detail popup." }
              - { label: "Show in Customer Favorites / Coming Soon Section", name: "showInCustomerFavorites", widget: "boolean", default: false, required: false, hint: "Turn this on only for products you want displayed in the homepage Customer favorites / Available favorites and coming-soon scents section." }



          - label: "Combo Deals"
            name: "combos"
            widget: "list"
            summary: "{{fields.name}} — {{fields.comboPrice}}"
            collapsed: false
            hint: "Create discounted combo/bundle offers customers can add to cart."
            fields:
              - { label: "Combo Name", name: "name", widget: "string", hint: "Example: Sweet Starter Combo" }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "Short buyer-facing description of the combo." }
              - { label: "What the Combo Contains", name: "includedItems", widget: "text", required: false, hint: "Example: 1 Fine Fragrance Mist + 1 Body Lotion/Cream + 1 Hand Sanitizer" }
              - { label: "Old Price / Original Price", name: "originalPrice", widget: "string", required: false, hint: "This will show crossed out. Example: GH₵470" }
              - { label: "Combo Discount Price", name: "comboPrice", widget: "string", hint: "Example: GH₵430" }
              - { label: "Discount Text", name: "discountText", widget: "string", required: false, hint: "Example: Save GH₵40 or 10% off" }
              - { label: "Combo Photo", name: "image", widget: "image", required: false, hint: "Upload a photo of the combo or one main product photo." }
              - { label: "Available", name: "available", widget: "boolean", default: true, required: false }


  - name: "pending_feedback"
    label: "Pending Customer Feedback"
    files:
      - name: "pendingFeedback"
        label: "Pending Customer Feedback"
        file: "data/pending-feedback.json"
        format: "json"
        fields:
          - label: "Pending Feedback"
            name: "pendingFeedback"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}} stars — Approved: {{fields.approved}}"
            collapsed: false
            hint: "Customer-submitted feedback appears here if the feedback function is connected to GitHub. Set Approved to true, then copy approved reviews into Scentivity Store → Products → Customer Reviews if you want them displayed."
            fields:
              - { label: "Submission ID", name: "id", widget: "string", required: false }
              - { label: "Customer Name", name: "name", widget: "string" }
              - { label: "Rating", name: "rating", widget: "number", default: 5, value_type: "int", min: 1, max: 5 }
              - { label: "Products Purchased", name: "productsPurchased", widget: "text", required: false, hint: "Products or combo the customer says they purchased." }
              - { label: "Review Message", name: "message", widget: "text" }
              - { label: "Approved", name: "approved", widget: "boolean", default: false, required: false }
              - { label: "Submitted At", name: "date", widget: "datetime", required: false }
              - { label: "Source", name: "source", widget: "string", default: "customer_submission", required: false }

